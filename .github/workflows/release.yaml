name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.4.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Extract public key from signing key
        env:
          SIGNING_KEY: ${{ secrets.DUCKDB_EXTENSION_SIGNING_KEY }}
        if: ${{ env.SIGNING_KEY != '' }}
        run: |
          echo "$SIGNING_KEY" > /tmp/signing_key.pem
          chmod 600 /tmp/signing_key.pem
          openssl rsa -in /tmp/signing_key.pem -pubout -out signing_key.pub 2>/dev/null
          rm -f /tmp/signing_key.pem

      - name: Build libtrexsql
        run: |
          SIGNING_KEY_ARG=""
          if [ -f ${{ github.workspace }}/signing_key.pub ]; then
            SIGNING_KEY_ARG="-DDUCKDB_CUSTOM_SIGNING_KEYS=${{ github.workspace }}/signing_key.pub"
          fi
          mkdir -p build/release && cd build/release
          cmake ../.. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=1 \
            -DBUILD_UNITTESTS=OFF \
            $SIGNING_KEY_ARG
          cmake --build . --config Release --target trexsql
        working-directory: crates/libduckdb-sys/duckdb-sources

      - name: Prepare artifacts
        run: |
          mkdir -p libtrexsql
          cp crates/libduckdb-sys/duckdb-sources/build/release/src/libtrexsql.so libtrexsql/libtrexsql.so
          cp crates/libduckdb-sys/duckdb-sources/src/include/duckdb.h libtrexsql/

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run tests
        env:
          TREXSQL_LIB_DIR: ${{ github.workspace }}/libtrexsql
          TREXSQL_INCLUDE_DIR: ${{ github.workspace }}/libtrexsql
          LD_LIBRARY_PATH: ${{ github.workspace }}/libtrexsql
        run: cargo test --features "modern-full vtab-full vtab-loadable"
        continue-on-error: true

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Package release
        run: |
          cd libtrexsql
          zip ../libtrexsql-linux-amd64.zip libtrexsql.so duckdb.h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtrexsql-linux-amd64
          path: libtrexsql-linux-amd64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: libtrexsql-linux-amd64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
