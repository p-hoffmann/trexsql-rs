name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  build-lib:
    name: Build libtrexsql (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Extract public key from signing key
        env:
          SIGNING_KEY: ${{ secrets.DUCKDB_EXTENSION_SIGNING_KEY }}
        if: ${{ env.SIGNING_KEY != '' }}
        run: |
          echo "$SIGNING_KEY" > /tmp/signing_key.pem
          chmod 600 /tmp/signing_key.pem
          openssl rsa -in /tmp/signing_key.pem -pubout -out signing_key.pub 2>/dev/null
          rm -f /tmp/signing_key.pem

      - name: Build libtrexsql
        run: |
          SIGNING_KEY_ARG=""
          if [ -f ${{ github.workspace }}/signing_key.pub ]; then
            SIGNING_KEY_ARG="-DDUCKDB_CUSTOM_SIGNING_KEYS=${{ github.workspace }}/signing_key.pub"
          fi
          mkdir -p build/release && cd build/release
          cmake ../.. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=1 \
            $SIGNING_KEY_ARG
          cmake --build . --config Release
        working-directory: crates/libduckdb-sys/duckdb-sources

      - name: Prepare artifacts
        run: |
          mkdir -p libtrexsql
          cp crates/libduckdb-sys/duckdb-sources/build/release/src/libduckdb.so libtrexsql/libtrexsql.so
          cp crates/libduckdb-sys/duckdb-sources/src/include/duckdb.h libtrexsql/

      - name: Upload libtrexsql
        uses: actions/upload-artifact@v4
        with:
          name: libtrexsql-linux-amd64
          path: libtrexsql/

  test-rust:
    name: Test Rust bindings (${{ matrix.target }})
    needs: build-lib
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Download libtrexsql
        uses: actions/download-artifact@v4
        with:
          name: libtrexsql-linux-amd64
          path: libtrexsql

      - run: cargo fmt --all -- --check

      - name: Run cargo clippy
        env:
          TREXSQL_LIB_DIR: ${{ github.workspace }}/libtrexsql
          TREXSQL_INCLUDE_DIR: ${{ github.workspace }}/libtrexsql
          LD_LIBRARY_PATH: ${{ github.workspace }}/libtrexsql
        run: cargo clippy --all-targets --workspace --locked -- -D warnings

      - name: Run cargo test
        env:
          TREXSQL_LIB_DIR: ${{ github.workspace }}/libtrexsql
          TREXSQL_INCLUDE_DIR: ${{ github.workspace }}/libtrexsql
          LD_LIBRARY_PATH: ${{ github.workspace }}/libtrexsql
        run: cargo test --features "modern-full vtab-full vtab-loadable"

      - name: Build loadable extension
        env:
          TREXSQL_LIB_DIR: ${{ github.workspace }}/libtrexsql
          TREXSQL_INCLUDE_DIR: ${{ github.workspace }}/libtrexsql
          LD_LIBRARY_PATH: ${{ github.workspace }}/libtrexsql
        run: cargo build --example hello-ext --features="vtab-loadable"

      - name: Build loadable extension (C API)
        env:
          TREXSQL_LIB_DIR: ${{ github.workspace }}/libtrexsql
          TREXSQL_INCLUDE_DIR: ${{ github.workspace }}/libtrexsql
          LD_LIBRARY_PATH: ${{ github.workspace }}/libtrexsql
        run: cargo build --example hello-ext-capi --features="vtab-loadable loadable-extension"
